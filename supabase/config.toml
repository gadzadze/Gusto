# Local Supabase for development and e2e tests: `npx supabase start`.
# Only the settings 202 depends on are listed; everything else uses the
# CLI defaults. Production is configured in the Supabase dashboard
# (README, "Supabase Auth setup") — keep the two in step.
#
# Database schema is NOT managed here: run `npm run db:migrate` (Drizzle)
# against the local database after `supabase start`.

project_id = "gusto"

[api]
port = 54321

[db]
port = 54322
# Match the production project's Postgres major version.
major_version = 17

[studio]
port = 54323

[auth]
minimum_password_length = 10
# Sign-in is invite-only (README, "Access"): users are created by the app and
# its scripts through the admin API, never by self sign-up.
enable_signup = false
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3100/**"]

[auth.rate_limit]
# Local only: the defaults (2 emails an hour) are far below what the e2e suite sends.
email_sent = 1000
sign_in_sign_ups = 1000

[auth.email]
# Newer CLIs read `enabled` (the email provider itself: needed for magic links and passwords); sign-ups stay
# off through `enable_signup = false` under [auth] above. The old `enable_signup` key here now switches the
# whole provider off, which made every sign-in fail with email_provider_disabled.
enabled = true
# The tests ask for a sign-in link right after the app generated one for the same address; GoTrue's default
# minimum gap between emails to one address is 60 s, which would refuse the second.
max_frequency = "1s"
# Magic links confirm the address; no separate confirmation step.
enable_confirmations = false

[auth.email.template.magic_link]
subject = "202 — შესვლის ბმული"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "202 — შესვლის ბმული"
content_path = "./supabase/templates/magic-link.html"

[auth.external.google]
# Set both variables in your shell (or supabase/.env) and switch this on to
# test Google sign-in locally.
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
