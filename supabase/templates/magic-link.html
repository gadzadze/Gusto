<!-- Used for both "Magic link" and "Confirm signup". The link must go to
     /auth/confirm with the token hash; see src/app/auth/confirm/route.ts.
     The header is "202" as white text on the brand burgundy (#7a1f2b, the --brand token): no image,
     so nothing has to load and no email client can block it. Table layout and inline styles on purpose. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px">
  <tr>
    <td bgcolor="#7a1f2b" style="background-color:#7a1f2b;padding:20px 24px;border-radius:8px;font-family:Helvetica,Arial,sans-serif;font-size:28px;line-height:32px;font-weight:700;letter-spacing:-0.5px;color:#ffffff">202</td>
  </tr>
</table>
<h2>შესვლა 202-ში</h2>
<p>202-ში შესასვლელად დააჭირეთ ღილაკს:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
     style="display:inline-block;padding:12px 20px;background:#0b0b0c;color:#ffffff;border-radius:8px;text-decoration:none">
    შესვლა
  </a>
</p>
<p style="color:#57534e">ბმული ერთჯერადია და მალე იწურება. თუ შესვლა თქვენ არ მოგითხოვიათ, უგულებელყავით ეს წერილი.</p>
