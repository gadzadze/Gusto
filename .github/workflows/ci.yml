name: CI

# Checks only. Deploys happen through Vercel's Git integration, not here.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No secrets: the build must succeed without runtime configuration.
      - run: npm run build
      # Nothing server-side may end up in what browsers download.
      - run: npm run check:secrets

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gusto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gusto_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: End-to-end tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A throwaway local Supabase (Postgres, Auth, Storage) inside the runner: never a real project.
      # Pinned: "latest" is looked up through the unauthenticated GitHub API, which rate-limits shared runners
      # (the job then fails before any test runs), and a pin keeps the e2e run reproducible.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,postgres-meta
      # Writes the local URL and keys into .env.local; refuses anything that is not a local address.
      - run: npm run env:local
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      # The suite builds the app itself (playwright.config.ts) and starts it on port 3100.
      - run: npx playwright test --trace off
        env:
          CI: "true"
      - name: Upload the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup
